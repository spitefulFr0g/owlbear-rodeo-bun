name: Frontend checks

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.0
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn typecheck
