name: Backend checks

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "backend/**"
      - "src/sceneRules/**"
      - "src/scene/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "src/sceneRules/**"
      - "src/scene/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      # Shared scene tests import the frontend's geometry dependencies.
      - run: yarn install --frozen-lockfile --non-interactive
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run smoke
